<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Email Generator</title>

  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg"></div>

  <main class="app">
    <header>
      <h1>AI Email Generator</h1>
      <p>Generate professional emails using Generative AI</p>
    </header>

    <section class="glass">
      <textarea id="prompt" placeholder="Example: Write a professional leave email to my manager"></textarea>

      <button id="generateBtn">
        <span>Generate Email</span>
      </button>

      <div id="loader" class="hidden">Generating with AI...</div>
    </section>

    <section class="glass output">
      <h3>Generated Email</h3>
      <div id="result">Your AI-generated email will appear here.</div>
    </section>

    <footer>
      <span>IBM SkillsBuild | GenAI Capstone</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
