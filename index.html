<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Email Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>🤖 AI Email Generator</h1>
      <p>Generate professional emails instantly using Generative AI</p>
    </header>

    <section class="card">
      <label for="prompt">Describe your email</label>
      <textarea id="prompt" placeholder="Example: Write a professional leave email to my manager for 2 days"></textarea>

      <button id="generateBtn">✨ Generate Email</button>

      <div id="loading" class="hidden">⏳ Generating email...</div>
    </section>

    <section class="output-card">
      <h2>📩 Generated Email</h2>
      <pre id="result">Your generated email will appear here...</pre>
    </section>

    <footer>
      <p>Powered by <strong>Google Gemini AI</strong> | Deployed on <strong>Render & Vercel</strong></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
