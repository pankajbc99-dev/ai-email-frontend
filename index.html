<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Email Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
    }
    pre {
      background: #eee;
      padding: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>AI Email Generator</h2>

    <textarea id="prompt" placeholder="Write an email to manager for leave"></textarea>

    <button onclick="generateEmail()">Generate Email</button>

    <h3>Generated Email:</h3>
    <pre id="result"></pre>
  </div>

  <script>
    async function generateEmail() {
      const prompt = document.getElementById("prompt").value;
      const resultBox = document.getElementById("result");

      resultBox.textContent = "Generating...";

      try {
        const response = await fetch(
          "https://ai-email-backend-y4px.onrender.com/api/generate",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ prompt })
          }
        );

        const data = await response.json();

        if (data.error) {
          resultBox.textContent = "Error: " + data.error;
        } else {
          resultBox.textContent = data.generatedText;
        }

      } catch (err) {
        resultBox.textContent = "Request failed";
      }
    }
  </script>

</body>
</html>
