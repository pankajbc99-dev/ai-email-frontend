<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Email Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>✉️ AI Email Generator</h1>
    <p class="subtitle">
      Generate professional emails using Generative AI (Google Gemini)
    </p>

    <textarea
      id="prompt"
      placeholder="Example: Write a professional leave email for school..."
    ></textarea>

    <button onclick="generateEmail()">Generate Email</button>

    <div id="loading" class="hidden">Generating...</div>

    <div id="result" class="result hidden">
      <h3>Generated Email</h3>
      <pre id="output"></pre>
    </div>
  </div>

  <footer>
    Built for IBM SkillsBuild CSRBOX Internship 🌍 SDG 4 – Quality Education
  </footer>

  <script src="script.js"></script>
</body>
</html>
